<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>景觀生心理研究 · Psycho-Physiology Study</title>
<style>
  :root{
    --cream:#faf6ea; --paper:#fffdf7; --line:#e7ddc6;
    --moss:#5b7a45; --moss-deep:#3f5a2f; --teal:#2c6b5f; --clay:#b8694a;
    --ink:#33301f; --soft:#6b6750;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:
      radial-gradient(1200px 500px at 50% -10%, #fff8e8 0%, var(--cream) 60%);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif;
    line-height:1.65;display:flex;align-items:center;justify-content:center;}
  .wrap{max-width:560px;width:100%;padding:40px 20px 56px;}
  .brand{font-family:"Noto Serif TC",Georgia,serif;font-size:13px;letter-spacing:3px;
    color:var(--teal);text-transform:uppercase;margin:0 0 4px;}
  h1{font-family:"Noto Serif TC",Georgia,serif;font-size:27px;color:var(--moss-deep);
    margin:0 0 6px;letter-spacing:1px;}
  .sub{color:var(--soft);font-size:14.5px;margin:0 0 6px;}
  .en{font-family:"Noto Serif TC",Georgia,serif;font-style:italic;font-size:14.5px;
    letter-spacing:1.5px;color:var(--teal);margin:0 0 8px;}
  .flow{color:var(--soft);font-size:12.5px;margin:0 0 26px;}
  .flow b{color:var(--moss);}
  a.card{display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit;
    background:var(--paper);border:1px solid var(--line);border-radius:14px;
    padding:16px 18px;margin:12px 0;transition:transform .12s ease, box-shadow .12s ease, border-color .12s;}
  a.card:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(63,90,47,.10);border-color:#d6cbae;}
  .ico{flex:none;width:46px;height:46px;border-radius:12px;display:flex;align-items:center;
    justify-content:center;font-size:22px;background:#eef3e8;border:1px solid #d9e6cc;}
  .c-panel .ico{background:#e7f1ec;border-color:#c7e0d6;}
  .c-console .ico{background:#eef3e8;border-color:#d9e6cc;}
  .c-guide .ico{background:#fbf0e9;border-color:#ecd2c4;}
  .ct{flex:1;min-width:0;}
  .ct .t{font-family:"Noto Serif TC",serif;font-size:17.5px;font-weight:600;color:var(--moss-deep);}
  .ct .d{font-size:13px;color:var(--soft);margin-top:1px;}
  .arr{flex:none;color:#b9b29a;font-size:20px;}
  .foot{margin-top:24px;text-align:center;color:var(--soft);font-size:12px;}
  .foot .dot{height:3px;width:54px;margin:0 auto 12px;border-radius:3px;
    background:linear-gradient(90deg,var(--moss),var(--teal));}
</style>
</head>
<body>
<div class="wrap">
  <p class="brand">HEALS Design</p>
  <h1>景觀生心理研究</h1>
  <p class="en">Psycho-Physiology Study</p>
  <p class="sub">遠端遙控 · 連續收集 · 心率路線圖</p>
  <p class="flow"><b>面板開始</b> → 手機自動記錄 → 走測 → <b>面板停止</b> → 手機上傳 → <b>主控台出圖</b></p>

  <a class="card c-panel" href="panel.html">
    <div class="ico">🎛️</div>
    <div class="ct"><div class="t">控制面板</div><div class="d">開始／停止研究、看各專案狀態</div></div>
    <div class="arr">›</div>
  </a>

  <a class="card c-console" href="console.html">
    <div class="ico">🗺️</div>
    <div class="ct"><div class="t">資料主控台</div><div class="d">抓取資料、出地圖與專案 Excel</div></div>
    <div class="arr">›</div>
  </a>

  <a class="card c-guide" href="guide.html">
    <div class="ico">📖</div>
    <div class="ct"><div class="t">操作手冊</div><div class="d">從頭到尾的步驟說明（含每步目的與操作）</div></div>
    <div class="arr">›</div>
  </a>

  <div class="foot">
    <div class="dot"></div>
    一場走測：開始 → 走（手錶開「戶外步行」）→ 停止 → 充電同步 → 撈取 → 上傳 → 抓取出圖
  </div>
</div>
</body>
</html>
