<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>即時監看 — 讀人 · 即時心理生理研究平台</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{
    --cream:#faf6ea; --paper:#fffdf7; --line:#e7ddc6;
    --moss:#5b7a45; --moss-deep:#3f5a2f; --teal:#2c6b5f; --clay:#b8694a;
    --ink:#33301f; --soft:#6b6750;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--cream);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif;line-height:1.6;}
  .wrap{max-width:1000px;margin:0 auto;padding:20px 18px 60px;}
  h1{font-family:"Noto Serif TC",Georgia,serif;font-size:24px;color:var(--moss-deep);margin:0 0 4px;letter-spacing:.5px;}
  h1 span.zh{margin-left:10px;font-size:19px;}
  .sub{color:var(--soft);font-size:14px;margin:0 0 14px;}
  .rule{height:3px;background:linear-gradient(90deg,var(--moss),var(--teal));border-radius:3px;margin:0 0 16px;}
  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0;}
  .backlink{color:var(--moss-deep);text-decoration:none;font-size:14px;}
  .backlink:hover{text-decoration:underline;}
  select{padding:8px 11px;border:1px solid var(--line);border-radius:8px;background:var(--paper);
    font-size:14.5px;font-family:inherit;color:var(--ink);}
  .meta{font-size:12.5px;color:var(--soft);}
  #map{height:480px;border:1px solid var(--line);border-radius:12px;margin:6px 0 14px;}
  .me{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 16px;
    display:none;align-items:center;gap:16px;margin:0 0 10px;}
  .me .hr{font-size:40px;font-weight:800;color:var(--clay);min-width:100px;}
  .me .hr small{font-size:14px;font-weight:400;color:var(--soft);}
  .me .info{font-size:13.5px;color:var(--soft);}
  .plist{display:flex;flex-direction:column;gap:8px;}
  .pcard{background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:10px 13px;}
  .pcard .head{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
  .pcard .name{font-weight:700;color:var(--moss-deep);}
  .pcard .count{font-size:12.5px;color:var(--soft);}
  .pcard .devs{font-size:13px;color:var(--ink);margin-top:2px;}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:baseline;}
  .empty{color:var(--soft);font-size:14px;padding:14px;text-align:center;
    border:1px dashed var(--line);border-radius:12px;background:var(--paper);}
  .hrchip{font-weight:700;color:var(--clay);}
</style>
</head>
<body>
<div class="wrap">
  <h1>HEALS<span class="zh">即時監看</span></h1>
  <p class="sub">走測中的裝置每半分鐘回報一次位置與最近心率；超過三分鐘沒回報就視為離線。心率來自 Apple Watch 經 HealthKit 遞送，可能落後實際數十秒到數分鐘。</p>
  <div class="rule"></div>

  <div class="bar">
    <a class="backlink" href="index.html">← 專案列表</a>
    <span style="flex:1"></span>
    <label class="meta" for="projSel">範圍</label>
    <select id="projSel"><option value="__all__">全部專案</option></select>
    <span class="meta" id="stamp">—</span>
  </div>

  <div class="me" id="me">
    <div class="hr"><span id="meHr">—</span><small> bpm</small></div>
    <div class="info" id="meInfo">等待你的裝置回報…</div>
  </div>

  <div id="map"></div>

  <div class="plist" id="plist"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
  "use strict";
  var $ = function(s){ return document.querySelector(s); };
  var PALETTE = ["#5b7a45","#2c6b5f","#b8694a","#7a6a2e","#4a6b8a","#8a4a6b","#3f5a2f","#a1743a"];
  var qs = new URLSearchParams(location.search);
  var selProject = qs.get("project") || "__all__";
  var myCode = (qs.get("code") || "").trim();     // 個人模式：只看自己
  var timer = null, firstFit = true;

  var map = L.map("map").setView([25.0330, 121.5654], 13);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    { maxZoom: 19, attribution: "© OpenStreetMap" }).addTo(map);
  var markers = [];

  function colorFor(id){
    var h = 0;
    for (var i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0;
    return PALETTE[h % PALETTE.length];
  }
  function clearMarkers(){
    markers.forEach(function(m){ map.removeLayer(m); });
    markers = [];
  }

  /* 專案下拉：自登記表載入 */
  function loadProjects(){
    fetch("/api/projects", {cache:"no-store"})
      .then(function(r){ return r.json(); })
      .then(function(d){
        var sel = $("#projSel");
        (d.projects || []).filter(function(p){ return (p.status||"active")!=="archived"; })
          .forEach(function(p){
            var o = document.createElement("option");
            o.value = p.id;
            o.textContent = (p.name || p.id) + "（" + p.id + "）";
            sel.appendChild(o);
          });
        if ([].some.call(sel.options, function(o){ return o.value === selProject; })) {
          sel.value = selProject;
        }
      })
      .catch(function(){});
  }
  $("#projSel").addEventListener("change", function(){
    selProject = $("#projSel").value;
    firstFit = true;
    refresh();
  });

  /* 取即時資料 → 畫地圖與清單 */
  function refresh(){
    var u = selProject === "__all__" ? "/api/live?all=1" : "/api/live?project=" + encodeURIComponent(selProject);
    fetch(u + (u.indexOf("?")>=0 ? "&" : "?") + "t=" + Date.now(), {cache:"no-store"})
      .then(function(r){ return r.json(); })
      .then(function(d){
        var groups = d.projects
          ? d.projects
          : [{ id: d.project, name: d.project, devices: d.devices || [] }];
        render(groups);
        $("#stamp").textContent = "更新於 " + new Date().toLocaleTimeString();
      })
      .catch(function(e){ $("#stamp").textContent = "更新失敗：" + e.message; });
  }

  function render(groups){
    clearMarkers();
    var box = $("#plist");
    box.innerHTML = "";
    var pts = [], total = 0, meFound = null;

    groups.forEach(function(g){
      var color = colorFor(g.id || "");
      var devs = g.devices || [];
      if (myCode) devs = devs.filter(function(dv){ return (dv.code||"") === myCode; });
      total += devs.length;

      devs.forEach(function(dv){
        if (dv.lat == null || dv.lng == null) return;
        var m = L.circleMarker([dv.lat, dv.lng], {
          radius: 9, color: "#fff", weight: 2, fillColor: color, fillOpacity: .95
        }).addTo(map);
        m.bindTooltip(
          (g.name || g.id) + " " + (dv.code || "") +
          (dv.hr != null ? "　♥" + dv.hr : "　♥—"),
          { permanent: true, direction: "top", offset: [0, -8] });
        markers.push(m);
        pts.push([dv.lat, dv.lng]);
        if (myCode && (dv.code||"") === myCode) meFound = dv;
      });

      var card = document.createElement("div");
      card.className = "pcard";
      var devLine = devs.length
        ? devs.map(function(dv){
            return (dv.code || "？") + "（<span class='hrchip'>♥" + (dv.hr != null ? dv.hr : "—") +
                   "</span>・" + dv.ageSec + " 秒前）";
          }).join("　")
        : "<span class='meta'>目前沒有裝置在回報</span>";
      card.innerHTML =
        '<div class="head"><span class="dot" style="background:' + color + '"></span>' +
        '<span class="name"></span><span class="count">' + devs.length + ' 人測試中</span></div>' +
        '<div class="devs">' + devLine + "</div>";
      card.querySelector(".name").textContent = g.name || g.id;
      box.appendChild(card);
    });

    if (!total) {
      var e = document.createElement("div");
      e.className = "empty";
      e.textContent = myCode
        ? "還沒收到你的裝置回報。開始走測後約半分鐘內會出現。"
        : "目前沒有進行中的量測。";
      box.appendChild(e);
    }

    if (pts.length && firstFit) {
      map.fitBounds(L.latLngBounds(pts).pad(0.3));
      firstFit = false;
    }

    /* 個人模式面板 */
    if (myCode) {
      $("#me").style.display = "flex";
      if (meFound) {
        $("#meHr").textContent = meFound.hr != null ? meFound.hr : "—";
        $("#meInfo").textContent = "編號 " + meFound.code + "・位置與心率更新於 " + meFound.ageSec + " 秒前";
        if (meFound.lat != null) map.setView([meFound.lat, meFound.lng], Math.max(map.getZoom(), 16));
      } else {
        $("#meHr").textContent = "—";
        $("#meInfo").textContent = "等待你的裝置回報…（開始走測後約半分鐘）";
      }
    }
  }

  loadProjects();
  refresh();
  timer = setInterval(refresh, 20000);
})();
</script>
</body>
</html>
